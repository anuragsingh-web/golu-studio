# Nightly game factory.
# 19:30 UTC = 1:00 AM IST. Also runnable by hand (Actions → Nightly autopilot → Run workflow).
#
# The job commits kept games back to main, then deploys the gallery with actions/deploy-pages.
# A push made with the default GITHUB_TOKEN does not start the separate Pages workflow,
# so this file deploys itself after a successful night.
#
# One-time repo settings (not expressible in YAML): see README "Nightly autopilot and gallery".
#   - Actions secret CURSOR_API_KEY
#   - Settings → Actions → General → Workflow permissions → Read and write
#   - Settings → Pages → Source → GitHub Actions
#   - If main is protected, let the GitHub Actions bot push

name: Nightly autopilot

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Combinations to try'
        required: false
        default: '20'
        type: string
      threshold:
        description: 'Minimum Pintu score to keep (0-10)'
        required: false
        default: '7'
        type: string
      mock:
        description: 'Offline mock (no Cursor calls, does not publish)'
        required: false
        default: false
        type: boolean

jobs:
  night:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: golu-autopilot
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      mock: ${{ steps.mode.outputs.mock }}
    env:
      MOCK: ${{ (github.event_name == 'workflow_dispatch' && (inputs.mock == true || inputs.mock == 'true')) && '1' || '0' }}
      H5_FIX_ROUNDS: '1'
      CURSOR_AGENT_TIMEOUT_MIN: '14'
      CURSOR_AGENT_CONCURRENCY: '2'
      AUTOPILOT_PARALLEL: '2'
      AUTOPILOT_GAME_TIMEOUT_MIN: '30'
      NO_OPEN: '1'
      CHROME_PATH: /usr/bin/google-chrome-stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Record mode
        id: mode
        run: echo "mock=${MOCK}" >> "$GITHUB_OUTPUT"

      - name: Require CURSOR_API_KEY
        if: env.MOCK != '1'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "::error title=Missing CURSOR_API_KEY::The Actions secret CURSOR_API_KEY is not set. Add it under Settings → Secrets and variables → Actions. Create the key at https://cursor.com/dashboard/api. Nightly runs cannot use a browser login."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates fonts-liberation fonts-noto-color-emoji
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
          google-chrome-stable --version

      - name: Install Cursor CLI
        if: env.MOCK != '1'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.local/bin/cursor-agent" || test -x "$HOME/.local/bin/agent"
          "$HOME/.local/bin/cursor-agent" --version || "$HOME/.local/bin/agent" --version

      - name: Run autopilot
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          node scripts/autopilot.js \
            --count "${{ github.event_name == 'workflow_dispatch' && inputs.count || '20' }}" \
            --threshold "${{ github.event_name == 'workflow_dispatch' && inputs.threshold || '7' }}"

      - name: Commit kept games
        if: env.MOCK != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- gallery data/autopilot
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            msg=$(node -e "const r=require('./data/autopilot/latest.json'); console.log('autopilot: kept '+r.kept+' of '+r.tried+' (threshold '+r.threshold+') '+r.night+' IST')")
            git commit -m "$msg"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload gallery
        if: env.MOCK != '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: gallery

  deploy:
    needs: night
    if: needs.night.outputs.mock != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
